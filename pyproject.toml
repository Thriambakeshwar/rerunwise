[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rerunwise"
version = "0.1.0"
description = "Flaky-test classification and retry planning from CI history. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rerunwise contributors" }]
keywords = ["flaky tests", "ci", "junit", "testing", "statistics", "retries"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
rerunwise = "rerunwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
